<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Hund &amp; Handler</title>
<link rel="icon" href="/icons/favicon.png" />
<link rel="stylesheet" href="/styles.css" />
</head>
<body>
<div id="langSwitcher"></div>

<div class="status-page">
  <div class="status-card" id="statusCard">
    <div class="status-icon">🐾</div>
    <h1 id="statusTitle" data-i18n="confirming_title">Bekræfter din betaling…</h1>
    <p id="statusBody" data-i18n="confirming_body">Et øjeblik, det tager ikke lang tid.</p>
    <a href="/" class="btn btn-secondary" style="display:inline-block; margin-top:20px; text-decoration:none;" data-i18n="back_to_home_btn">Tilbage til forsiden</a>
  </div>
</div>

<script src="/i18n.js"></script>
<script>
  const API = '/api';
  const params = new URLSearchParams(window.location.search);
  const regId = params.get('reg');

  const titleEl = document.getElementById('statusTitle');
  const bodyEl = document.getElementById('statusBody');
  const iconEl = document.querySelector('.status-icon');

  function setStatus(iconTxt, titleKey, bodyKey) {
    iconEl.textContent = iconTxt;
    titleEl.removeAttribute('data-i18n');
    bodyEl.removeAttribute('data-i18n');
    titleEl.textContent = t(titleKey);
    bodyEl.textContent = t(bodyKey);
  }

  let lastState = null;

  async function poll(attempt = 0) {
    if (!regId) {
      setStatus('⚠️', 'not_found_title', 'not_found_body');
      lastState = ['not_found_title', 'not_found_body'];
      return;
    }

    try {
      const res = await fetch(`${API}/register/${regId}`);
      const reg = await res.json();

      if (reg.status === 'confirmed') {
        const bodyKey = reg.payment_method === 'pay_at_class' ? 'confirmed_body_pay_at_class' : 'confirmed_body_mobilepay';
        setStatus('✅', 'confirmed_title', bodyKey);
        lastState = ['confirmed_title', bodyKey, '✅'];
        return;
      }

      if (reg.status === 'failed' || reg.status === 'cancelled' || reg.status === 'expired') {
        setStatus('⚠️', 'failed_title', 'failed_body');
        lastState = ['failed_title', 'failed_body', '⚠️'];
        return;
      }

      if (attempt < 15) {
        setTimeout(() => poll(attempt + 1), 2000);
      } else {
        setStatus('🐾', 'still_confirming_title', 'still_confirming_body');
        lastState = ['still_confirming_title', 'still_confirming_body', '🐾'];
      }
    } catch (err) {
      setStatus('⚠️', 'generic_error_title', 'generic_error_body');
      lastState = ['generic_error_title', 'generic_error_body', '⚠️'];
    }
  }

  // If the language is switched after a status has already resolved,
  // re-translate the shown message.
  window.addEventListener('langchange', () => {
    if (lastState) {
      iconEl.textContent = lastState[2] || iconEl.textContent;
      titleEl.textContent = t(lastState[0]);
      bodyEl.textContent = t(lastState[1]);
    }
  });

  poll();
</script>
</body>
</html>
