<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Hund &amp; Handler — Admin</title>
<link rel="icon" href="/icons/favicon.png" />
<link rel="stylesheet" href="/styles.css" />
<style>
  .admin-wrap { max-width: 720px; margin: 0 auto; padding: 40px 20px 80px; }
  .admin-card { background: var(--pine-deep); border: 1px solid var(--line); border-radius: var(--radius); padding: 22px; margin-bottom: 24px; }
  .admin-card h2 { font-family: var(--font-display); margin-top: 0; }
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  label { display:block; font-size: 13px; margin: 10px 0 4px; color: var(--bone-dim); }
  input, textarea { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--pine); color: var(--bone); font-size: 14px; }
  textarea { min-height: 70px; font-family: inherit; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 10px; }
  th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--line); }
  .tag { display:inline-block; padding: 2px 8px; border-radius: 999px; font-size: 11px; }
  .tag-confirmed { background: rgba(200,155,60,0.2); color: var(--brass-bright); }
  .tag-pending { background: rgba(255,255,255,0.1); color: var(--bone-dim); }
  .tag-failed, .tag-expired, .tag-cancelled { background: rgba(181,83,60,0.2); color: var(--clay); }
  .btn-delete {
    appearance: none;
    border: none;
    background: transparent;
    color: var(--bone-dim);
    cursor: pointer;
    font-size: 14px;
    padding: 2px 6px;
    border-radius: 6px;
  }
  .btn-delete:hover { background: rgba(181,83,60,0.2); color: var(--clay); }
  .admin-logo { height: 34px; width: auto; border-radius: 4px; }
</style>
</head>
<body>
<div id="langSwitcher"></div>

<div class="admin-wrap">
  <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 20px;">
    <div style="display:flex; align-items:center; gap:12px;">
      <img class="admin-logo" src="/icons/logo.png" alt="Hund &amp; Handler" />
      <h1 class="wordmark" style="font-size:28px; margin:0;" data-i18n="admin_title">Admin</h1>
    </div>
    <div style="text-align:right;">
      <div id="userEmail" style="font-size:13px; color:var(--bone-dim); margin-bottom:6px;"></div>
      <button class="btn btn-secondary" id="logoutBtn" data-i18n="logout_btn">Log ud</button>
    </div>
  </div>

  <div class="admin-card">
    <h2 data-i18n="create_class_heading">Opret hold</h2>
    <form id="createForm">
      <label for="title" data-i18n="title_label">Titel</label>
      <input id="title" required />

      <label for="description" data-i18n="description_label">Beskrivelse</label>
      <textarea id="description"></textarea>

      <div class="grid-2">
        <div>
          <label for="starts_at" data-i18n="start_datetime_label">Startdato og -tid</label>
          <input id="starts_at" type="datetime-local" required />
        </div>
        <div>
          <label for="weekday" data-i18n="weekday_label">Ugedag (valgfrit)</label>
          <input id="weekday" placeholder="fx tirsdage" />
        </div>
      </div>

      <div class="grid-2">
        <div>
          <label for="location" data-i18n="location_label">Sted</label>
          <input id="location" />
        </div>
        <div>
          <label for="max_participants" data-i18n="max_participants_label">Maks. deltagere</label>
          <input id="max_participants" type="number" min="1" required />
        </div>
      </div>

      <label for="price_dkk" data-i18n="price_label">Pris (DKK)</label>
      <input id="price_dkk" type="number" min="0" required />

      <div style="margin-top:16px">
        <button class="btn btn-primary" type="submit" data-i18n="create_class_btn">Opret hold</button>
      </div>
      <div id="createMsg" class="form-error" style="color: var(--brass-bright)" hidden></div>
    </form>
  </div>

  <div class="admin-card">
    <h2 data-i18n="newsletter_heading">Nyhedsbrev</h2>
    <p style="color: var(--bone-dim); font-size: 13px; margin-top:-4px;">
      <span id="subscriberCount" data-i18n="loading_subscriber_count">Indlæser antal tilmeldte…</span>
    </p>
    <form id="newsletterForm">
      <label for="nlSubject" data-i18n="subject_label">Emne</label>
      <input id="nlSubject" required />

      <label for="nlMessage" data-i18n="message_label">Besked</label>
      <textarea id="nlMessage" required style="min-height:140px;"></textarea>

      <div style="margin-top:16px">
        <button class="btn btn-primary" type="submit" id="nlSendBtn" data-i18n="send_newsletter_btn">Send til abonnenter</button>
      </div>
      <div id="nlMsg" class="form-error" style="color: var(--brass-bright)" hidden></div>
    </form>
  </div>

  <div class="admin-card">
    <h2 data-i18n="classes_rosters_heading">Hold &amp; tilmeldte</h2>
    <div id="classesList" data-i18n="loading_msg">Indlæser…</div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="/supabase-config.js"></script>
<script src="/i18n.js"></script>
<script src="/admin.js"></script>
</body>
</html>
