<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Hund &amp; Handler</title>
<meta name="description" content="Tilmeld dig månedens hundetræningshold" />
<link rel="manifest" href="/manifest.json" />
<meta name="theme-color" content="#1F2A20" />
<link rel="icon" href="/icons/favicon.png" />
<link rel="apple-touch-icon" href="/icons/icon-192.png" />
<link rel="stylesheet" href="/styles.css" />
</head>
<body>

<div id="langSwitcher"></div>

<div class="wrap">
  <header class="hero">
    <img class="hero-logo" src="/icons/logo.png" alt="Hund &amp; Handler" />
    <span class="eyebrow" data-i18n="tagline">Nye hold hver måned</span>
    <p data-i18n="hero_intro">Vælg et hold, tilmeld din hund, og betal sikkert med MobilePay eller ved fremmøde. Din plads er bekræftet, så snart betalingen er på plads.</p>
  </header>

  <div class="lead-line" aria-hidden="true">
    <svg viewBox="0 0 760 28" preserveAspectRatio="none">
      <path d="M0,14 C 60,2 100,26 160,14 S 260,2 320,14 S 420,26 480,14 S 580,2 640,14 S 720,26 760,14"
            fill="none" stroke="#C89B3C" stroke-width="2" stroke-dasharray="1 10" stroke-linecap="round"/>
    </svg>
  </div>

  <main>
    <h2 class="section-title" data-i18n="classes_heading">Månedens hold</h2>
    <div id="classList" class="class-grid" aria-live="polite">
      <p style="color: var(--bone-dim)" data-i18n="loading_classes">Indlæser hold…</p>
    </div>
  </main>
</div>

<div id="modalRoot"></div>

<script src="/i18n.js"></script>
<script src="/app.js"></script>
</body>
</html>
